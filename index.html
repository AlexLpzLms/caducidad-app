<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mi Despensa</title>

  <!-- PWA / iOS home screen -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mi Despensa" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>🥫 Mi Despensa</h1>
    <button id="addBtn" class="fab" aria-label="Agregar alimento">＋</button>
  </header>

  <main>
    <div class="filter-bar">
      <select id="categoryFilter">
        <option value="todas">Todas las categorías</option>
        <option value="lacteos">Lácteos</option>
        <option value="carnes">Carnes / pescado</option>
        <option value="frutas">Frutas / verduras</option>
        <option value="congelados">Congelados</option>
        <option value="despensa">Despensa</option>
        <option value="otro">Otro</option>
      </select>
    </div>

    <div id="emptyState" class="empty-state hidden">
      <p>No tienes alimentos guardados todavía.</p>
      <p>Toca el botón <strong>＋</strong> para agregar el primero.</p>
    </div>

    <div id="foodGroups"></div>

    <details id="historySection" class="history-section hidden">
      <summary>Historial de consumidos (<span id="historyCount">0</span>)</summary>
      <div id="historyList" class="history-list"></div>
    </details>
  </main>

  <!-- Modal para agregar/editar alimento -->
  <dialog id="foodDialog">
    <form id="foodForm" method="dialog">
      <h2 id="dialogTitle">Nuevo alimento</h2>

      <label>
        Nombre
        <input type="text" id="foodName" required placeholder="Ej. Leche entera" />
      </label>

      <label>
        Categoría
        <select id="foodCategory">
          <option value="lacteos">Lácteos</option>
          <option value="carnes">Carnes / pescado</option>
          <option value="frutas">Frutas / verduras</option>
          <option value="congelados">Congelados</option>
          <option value="despensa">Despensa (seco/enlatado)</option>
          <option value="otro">Otro</option>
        </select>
      </label>

      <label>
        Cantidad
        <input type="text" id="foodQuantity" placeholder="Ej. 1 litro, 6 piezas" />
      </label>

      <label>
        Fecha de caducidad
        <input type="date" id="foodExpiry" required />
      </label>

      <input type="hidden" id="foodId" />

      <div class="dialog-actions">
        <div class="dialog-actions-left">
          <button type="button" id="deleteBtn" class="btn btn-danger hidden">Eliminar</button>
          <button type="button" id="consumedBtn" class="btn btn-consumed hidden">Consumido ✓</button>
        </div>
        <div class="dialog-actions-right">
          <button type="button" id="cancelBtn" class="btn btn-secondary">Cancelar</button>
          <button type="submit" id="saveBtn" class="btn btn-primary">Guardar</button>
        </div>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
